name: Nginx CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/nginx/**'
      - '.github/workflows/nginx-ci-cd.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/nginx/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::334689162817:role/github-actions-rupu
  ECR_REGISTRY: 334689162817.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: rupu-nginx
  INSTANCE_ID: i-08c946b3dd12fc8c9

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo de GitHub (gratis, on-demand)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: ./infra/nginx
        run: |
          BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV

          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_TIMESTAMP \
            --load \
            .

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_TIMESTAMP
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Imagen pusheada: $BUILD_TIMESTAMP (+ latest)"

  deploy:
    name: Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-nginx-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy nginx on EC2 (SSM RunShellScript)
        run: |
          set -e
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy nginx GHA ${{ github.sha }}" \
            --parameters commands='["bash /home/ubuntu/reserve/infra/compose-prod/deploy.sh nginx"]' \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          sleep 5
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" --query Status --output text)
          echo "===== STDOUT ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" --query StandardOutputContent --output text
          echo "===== STDERR ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" --query StandardErrorContent --output text
          echo "Status final: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
