name: Nginx CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/nginx/**'
      - '.github/workflows/nginx-ci-cd.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/nginx/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo - más rápido y barato
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ steps.get_account.outputs.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: ./infra/nginx
        run: |
          # Generar timestamp único para este build
          BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV

          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:latest \
            -t ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:$BUILD_TIMESTAMP \
            --load \
            .

      - name: Push image to ECR
        run: |
          # Push tag con timestamp primero (inmutable)
          docker push ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:${{ env.BUILD_TIMESTAMP }}

          # Luego push latest (sobrescribe)
          docker push ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:latest

          echo "✅ Imagen pusheada: ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:${{ env.BUILD_TIMESTAMP }}"
          echo "✅ Tag latest actualizado"

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    # Prevenir ejecuciones concurrentes del mismo workflow
    concurrency:
      group: deploy-nginx-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            
            # Actualizar PATH
            export PATH=\$PATH:\$HOME/.local/bin:/usr/local/bin:/usr/bin
            
            # No se necesita configuración especial de puertos para Docker
            echo "✅ Usando Docker (no requiere configuración especial de puertos)"
            
            cd ~/reserve/infra/compose-prod || exit 1
            
            # Verificar que existe .env
            if [ ! -f .env ]; then
              echo "❌ Error: Archivo .env no encontrado"
              exit 1
            fi
            
            # Configurar permisos de /etc/letsencrypt para que Podman rootless pueda leerlos
            echo "🔐 Configurando permisos de certificados SSL..."
            if [ -d "/etc/letsencrypt" ]; then
              # Ajustar permisos del directorio archive (donde están los archivos reales)
              if [ -d "/etc/letsencrypt/archive" ]; then
                echo "📁 Ajustando permisos de /etc/letsencrypt/archive..."
                sudo chmod -R 755 /etc/letsencrypt/archive 2>/dev/null || {
                  echo "⚠️ No se pudieron ajustar permisos de archive (puede ser normal)"
                }
                sudo find /etc/letsencrypt/archive -type f -exec chmod 644 {} \; 2>/dev/null || true
                sudo find /etc/letsencrypt/archive -type d -exec chmod 755 {} \; 2>/dev/null || true
              fi
              
              # Ajustar permisos del directorio live (donde están los symlinks)
              if [ -d "/etc/letsencrypt/live" ]; then
                echo "📁 Ajustando permisos de /etc/letsencrypt/live..."
                sudo chmod -R 755 /etc/letsencrypt/live 2>/dev/null || {
                  echo "⚠️ No se pudieron ajustar permisos de live (puede ser normal)"
                }
                sudo find /etc/letsencrypt/live -type f -exec chmod 644 {} \; 2>/dev/null || true
                sudo find /etc/letsencrypt/live -type d -exec chmod 755 {} \; 2>/dev/null || true
              fi
              
              echo "✅ Permisos de certificados configurados"
            else
              echo "⚠️ Directorio /etc/letsencrypt no existe"
            fi
            
            # Login a ECR usando el IAM Role
            echo "🔐 Login a ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} 2>&1 | \
              docker login --username AWS --password-stdin ${{ steps.get_account.outputs.ECR_REGISTRY }} || {
              echo "⚠️ Error en login a ECR"
              exit 1
            }

            # Obtener digest de la imagen actual (si existe)
            echo "📋 Verificando imagen actual..."
            OLD_DIGEST=$(docker inspect ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:latest 2>/dev/null | jq -r '.[0].Digest // "none"' || echo "none")
            echo "Digest anterior: $OLD_DIGEST"

            # Pull latest image
            echo "🔄 Pulling latest nginx image..."
            docker pull ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:latest || {
              echo "❌ No se pudo hacer pull de la imagen"
              exit 1
            }

            # Verificar que la imagen cambió
            NEW_DIGEST=$(docker inspect ${{ steps.get_account.outputs.ECR_REGISTRY }}/rupu-nginx:latest | jq -r '.[0].Digest')
            echo "Digest nuevo: $NEW_DIGEST"

            if [ "$OLD_DIGEST" = "$NEW_DIGEST" ] && [ "$OLD_DIGEST" != "none" ]; then
              echo "⚠️ ADVERTENCIA: La imagen no cambió. Puede ser un problema de cache."
            else
              echo "✅ Nueva imagen descargada correctamente"
            fi

            # Stop del contenedor antiguo
            echo "⏹️ Deteniendo contenedor antiguo..."
            docker stop nginx_prod 2>/dev/null || true

            # Remover contenedor antiguo
            echo "🗑️ Removiendo contenedor antiguo..."
            docker rm -f nginx_prod 2>/dev/null || true

            # Levantar el nuevo contenedor
            echo "🚀 Levantando nuevo contenedor nginx..."
            docker compose -f docker-compose.yaml up -d nginx

            # Esperar que el contenedor inicie
            echo "⏳ Esperando que nginx inicie..."
            sleep 5

            # Verificar health del servicio (puerto 80 y 443)
            echo "🏥 Verificando health del servicio..."
            MAX_RETRIES=10
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -sf http://localhost/ > /dev/null 2>&1; then
                echo "✅ Servicio HTTP healthy!"
                break
              fi
              RETRY=$((RETRY + 1))
              echo "Intento $RETRY/$MAX_RETRIES - esperando..."
              sleep 3
            done

            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ ERROR: El servicio no pasó el health check"
              echo "📋 Logs del contenedor:"
              docker logs --tail 50 nginx_prod
              exit 1
            fi

            # Verificar que el contenedor está corriendo
            echo "📊 Estado del servicio nginx:"
            docker ps --filter "name=nginx_prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || {
              echo "⚠️ No se encontró el contenedor nginx_prod"
              echo "📋 Todos los contenedores:"
              docker ps -a
            }

            # Clean up old images
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f || true

            echo "✅ Nginx desplegado y verificado exitosamente"
          EOF
