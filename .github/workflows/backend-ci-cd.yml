name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'back/central-reserve/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'back/central-reserve/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: public.ecr.aws/d3a6d4r1/cam/reserve
  IMAGE_NAME: backend

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo - más rápido y barato
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: ./back/central-reserve
        run: |
          # Cambiar al directorio padre para incluir dbpostgres en el contexto
          cd ../..

          # Generar timestamp único para este build
          BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV

          docker buildx build \
            --platform linux/arm64 \
            -f back/central-reserve/docker/Dockerfile \
            -t ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest \
            -t ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-$BUILD_TIMESTAMP \
            --load \
            .

      - name: Push image to ECR
        run: |
          # Push tag con timestamp primero (inmutable)
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-${{ env.BUILD_TIMESTAMP }}

          # Luego push latest (sobrescribe)
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest

          echo "✅ Imagen pusheada: ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-${{ env.BUILD_TIMESTAMP }}"
          echo "✅ Tag latest actualizado"

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # Prevenir ejecuciones concurrentes del mismo workflow
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/reserve/infra/compose-prod || exit 1

            # Login a ECR
            echo "🔐 Login a ECR..."
            aws ecr-public get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin public.ecr.aws

            # Obtener digest de la imagen actual (si existe)
            echo "📋 Verificando imagen actual..."
            OLD_DIGEST=$(docker inspect ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest 2>/dev/null | jq -r '.[0].Digest // "none"' || echo "none")
            echo "Digest anterior: $OLD_DIGEST"

            # Pull latest image
            echo "🔄 Pulling latest backend image..."
            docker pull ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest

            # Verificar que la imagen cambió
            NEW_DIGEST=$(docker inspect ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest | jq -r '.[0].Digest')
            echo "Digest nuevo: $NEW_DIGEST"

            if [ "$OLD_DIGEST" = "$NEW_DIGEST" ] && [ "$OLD_DIGEST" != "none" ]; then
              echo "⚠️ ADVERTENCIA: La imagen no cambió. Puede ser un problema de cache."
            else
              echo "✅ Nueva imagen descargada correctamente"
            fi

            # Stop del contenedor antiguo
            echo "⏹️ Deteniendo contenedor antiguo..."
            docker stop central_reserve_prod 2>/dev/null || true

            # Remover contenedor antiguo
            echo "🗑️ Removiendo contenedor antiguo..."
            docker rm -f central_reserve_prod 2>/dev/null || true

            # Levantar el nuevo contenedor
            echo "🚀 Levantando nuevo contenedor..."
            docker compose -f docker-compose.yaml up -d central_reserve

            # Esperar que el contenedor inicie
            echo "⏳ Esperando que el contenedor inicie..."
            sleep 10

            # Verificar health del servicio
            echo "🏥 Verificando health del servicio..."
            MAX_RETRIES=12
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -sf http://localhost:3050/health > /dev/null 2>&1; then
                echo "✅ Servicio healthy!"
                break
              fi
              RETRY=$((RETRY + 1))
              echo "Intento $RETRY/$MAX_RETRIES - esperando..."
              sleep 5
            done

            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ ERROR: El servicio no pasó el health check"
              echo "📋 Logs del contenedor:"
              docker logs --tail 50 central_reserve_prod
              exit 1
            fi

            # Mostrar estado
            echo "📊 Estado del servicio:"
            docker ps --filter "name=central_reserve_prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # Clean up old images (mantener últimas 3)
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f

            echo "✅ Backend desplegado y verificado exitosamente"
          EOF
