name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'back/central-reserve/**'
      - 'back/dbpostgres/**'
      - '.github/workflows/backend-ci-cd.yml'
      - '.github/scripts/ssm-deploy.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'back/central-reserve/**'
      - 'back/dbpostgres/**'
  workflow_dispatch:

# OIDC: permite asumir el rol IAM sin access keys
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::334689162817:role/github-actions-rupu
  ECR_REGISTRY: 334689162817.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: rupu-backend

jobs:
  # Solo pruebas UNITARIAS: las de integración (build tag "integration") y las e2e corren
  # únicamente en local (.claude/rules/testing.md). Si fallan, no se construye ni se despliega.
  unit-tests:
    name: Unit tests (Go)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back/central-reserve/go.mod
          cache-dependency-path: |
            back/central-reserve/go.sum
            back/dbpostgres/go.sum

      - name: Vet
        working-directory: back/central-reserve
        run: go vet ./...

      - name: Unit tests
        working-directory: back/central-reserve
        run: go test -count=1 ./...

  build-and-push:
    name: Build (ARM64) and Push to ECR
    needs: unit-tests
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo de GitHub (gratis en repos públicos)
    # En PRs solo se construye para validar; push a ECR solo desde main o manual
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: env.PUSH == 'true'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build image
        run: |
          # Contexto en la raíz para incluir dbpostgres
          BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV
          docker build \
            -f back/central-reserve/docker/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_TIMESTAMP \
            .
          docker image inspect ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format 'Arquitectura: {{.Os}}/{{.Architecture}}'

      - name: Push image to ECR
        if: env.PUSH == 'true'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_TIMESTAMP
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Imagen pusheada: $BUILD_TIMESTAMP (+ latest)"

  deploy:
    name: Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend on EC2 (SSM)
        run: bash .github/scripts/ssm-deploy.sh backend
