name: Deploy All Services

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infra/compose-prod/**'

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy All Services
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy all services
        run: |
          # Crear directorio en EC2 si no existe e instalar dependencias
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'SETUP_EOF'
            set -e
            mkdir -p ~/reserve/infra/compose-prod
            
            # Instalar AWS CLI si no está instalado
            if ! command -v aws &> /dev/null; then
              echo "📦 Instalando AWS CLI..."
              curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              sudo ./aws/install
              rm -rf aws awscliv2.zip
              echo "✅ AWS CLI instalado"
            else
              echo "✅ AWS CLI ya está instalado"
            fi
            
            # Verificar e instalar Podman y podman-compose
            if ! command -v podman &> /dev/null; then
              echo "📦 Instalando Podman..."
              sudo apt-get update
              sudo apt-get install -y podman
              echo "✅ Podman instalado"
            else
              echo "✅ Podman ya está instalado"
            fi
            
            # Instalar podman-compose si no está disponible
            if ! command -v podman-compose &> /dev/null; then
              echo "📦 Instalando podman-compose..."
              
              # Método 1: Intentar con pipx (recomendado para Ubuntu 24.04)
              if command -v pipx &> /dev/null; then
                echo "📦 Instalando con pipx..."
                pipx install podman-compose || {
                  echo "⚠️ pipx falló, intentando método alternativo..."
                  # Método 2: Instalar pipx si no está disponible
                  if ! command -v pipx &> /dev/null; then
                    sudo apt-get install -y pipx
                    pipx ensurepath
                  fi
                  pipx install podman-compose
                }
                # pipx instala en ~/.local/bin, asegurar que esté en PATH
                export PATH="$HOME/.local/bin:$PATH"
                sudo ln -sf "$HOME/.local/bin/podman-compose" /usr/local/bin/podman-compose 2>/dev/null || true
              else
                # Método 2: Instalar pipx primero
                echo "📦 Instalando pipx..."
                sudo apt-get install -y pipx
                pipx ensurepath
                export PATH="$HOME/.local/bin:$PATH"
                pipx install podman-compose
                sudo ln -sf "$HOME/.local/bin/podman-compose" /usr/local/bin/podman-compose 2>/dev/null || true
              fi
              
              # Método 3: Si pipx falla, usar pip con --break-system-packages (último recurso)
              if ! command -v podman-compose &> /dev/null; then
                echo "⚠️ pipx falló, usando pip con --break-system-packages..."
                pip3 install --user --break-system-packages podman-compose || \
                sudo pip3 install --break-system-packages podman-compose
                
                # Asegurar que esté en el PATH
                if [ -f "$HOME/.local/bin/podman-compose" ]; then
                  sudo ln -sf "$HOME/.local/bin/podman-compose" /usr/local/bin/podman-compose || true
                fi
              fi
              
              # Verificar instalación final
              if command -v podman-compose &> /dev/null; then
                echo "✅ podman-compose instalado: $(which podman-compose)"
              else
                echo "❌ Error: No se pudo instalar podman-compose"
                exit 1
              fi
            else
              echo "✅ podman-compose ya está instalado: $(which podman-compose)"
            fi
            
            # Verificar instalaciones finales
            echo "🔍 Verificando instalaciones..."
            command -v aws && aws --version || echo "❌ AWS CLI no disponible"
            command -v podman && podman --version || echo "❌ Podman no disponible"
            command -v podman-compose && podman-compose --version || echo "❌ podman-compose no disponible"
          SETUP_EOF
          
          # Subir podman-compose.yaml
          scp -o StrictHostKeyChecking=no \
            infra/compose-prod/podman-compose.yaml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/reserve/infra/compose-prod/
          
          # Verificar/crear archivo .env si no existe
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENV_CHECK'
            set -e
            cd ~/reserve/infra/compose-prod || exit 1
            
            if [ ! -f .env ]; then
              echo "⚠️ Archivo .env no encontrado"
              echo "📝 Creando archivo .env desde template..."
              
              # Crear .env básico si no existe
              cat > .env << 'ENV_TEMPLATE'
# Archivo de variables de entorno para producción
# IMPORTANTE: Completa estos valores con tus credenciales reales

# Base de datos PostgreSQL
DB_NAME=reserve_db
DB_USER=postgres
DB_PASSWORD=CHANGE_ME
DB_LOG_LEVEL=info
DB_SSLMODE=disable

# Aplicación
APP_ENV=production
LOG_LEVEL=info
JWT_SECRET=CHANGE_ME_GENERATE_SECURE_SECRET

# Swagger
URL_BASE_SWAGGER=https://tu-dominio.com/api/v1

# SMTP (Email)
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USER=CHANGE_ME
SMTP_PASS=CHANGE_ME
FROM_EMAIL=noreply@tu-dominio.com
SMTP_USE_STARTTLS=true
SMTP_USE_TLS=false

# S3 (Almacenamiento)
S3_BUCKET=CHANGE_ME
S3_REGION=us-east-1
S3_KEY=CHANGE_ME
S3_SECRET=CHANGE_ME
URL_BASE_DOMAIN_S3=https://CHANGE_ME.s3.amazonaws.com

# Nginx
DOMAIN=tu-dominio.com
SSL_CERT_PATH=/etc/letsencrypt/live/tu-dominio.com/fullchain.pem
SSL_KEY_PATH=/etc/letsencrypt/live/tu-dominio.com/privkey.pem
ENV_TEMPLATE
              
              echo "✅ Archivo .env creado con valores por defecto"
              echo "⚠️ IMPORTANTE: Edita ~/reserve/infra/compose-prod/.env con tus valores reales antes de desplegar"
            else
              echo "✅ Archivo .env ya existe"
            fi
          ENV_CHECK
          
          # Ejecutar despliegue
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            
            # Actualizar PATH para incluir ubicaciones comunes
            export PATH=\$PATH:\$HOME/.local/bin:/usr/local/bin:/usr/bin
            
            # Verificar que podman-compose esté disponible
            if ! command -v podman-compose &> /dev/null; then
              echo "❌ podman-compose no está disponible. Verificando instalación..."
              # Intentar encontrar podman-compose
              PODMAN_COMPOSE_PATH=\$(which podman-compose 2>/dev/null || find \$HOME -name podman-compose 2>/dev/null | head -1 || find /usr -name podman-compose 2>/dev/null | head -1)
              if [ -n "\$PODMAN_COMPOSE_PATH" ]; then
                echo "📍 Encontrado podman-compose en: \$PODMAN_COMPOSE_PATH"
                export PATH=\$PATH:\$(dirname \$PODMAN_COMPOSE_PATH)
              else
                echo "❌ Error: podman-compose no se encuentra. Reinstalando..."
                pip3 install --user podman-compose || sudo pip3 install podman-compose
                export PATH=\$PATH:\$HOME/.local/bin:/usr/local/bin
              fi
              
              # Verificar nuevamente
              if ! command -v podman-compose &> /dev/null; then
                echo "❌ Error crítico: podman-compose no está disponible después de intentar instalarlo"
                exit 1
              fi
            fi
            
            echo "✅ podman-compose disponible: \$(which podman-compose)"
            
            cd ~/reserve/infra/compose-prod || exit 1
            
            echo "🚀 Desplegando todos los servicios..."
            
            # Login a ECR usando el IAM Role
            echo "🔐 Login a ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} 2>&1 | \
              podman login --username AWS --password-stdin ${{ steps.get_account.outputs.ECR_REGISTRY }} || {
              echo "⚠️ Error en login a ECR, verificando IAM Role..."
              aws sts get-caller-identity || echo "❌ No se puede autenticar con AWS"
              exit 1
            }
            
            # Pull latest images
            echo "🔄 Pulling latest images from ECR..."
            podman-compose -f podman-compose.yaml pull
            
            # Update and restart all services
            echo "🚀 Updating services..."
            podman-compose -f podman-compose.yaml up -d
            
            # Show status
            echo "📊 Service status:"
            podman-compose -f podman-compose.yaml ps
            
            # Clean up old images
            podman image prune -f
            
            echo "✅ Despliegue completado"
          EOF
