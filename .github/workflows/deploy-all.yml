name: Deploy All Services

on:
  # Deshabilitado push automático - usar workflow_dispatch para ejecutar manualmente
  # push:
  #   branches:
  #     - main
  #     - develop
  workflow_dispatch:  # Solo ejecución manual para evitar conflictos con otros workflows

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy All Services
    runs-on: ubuntu-latest

    # Prevenir ejecuciones concurrentes
    concurrency:
      group: deploy-all-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy all services
        run: |
          # Subir docker-compose.yaml si cambió
          scp -o StrictHostKeyChecking=no \
            infra/compose-prod/docker-compose.yaml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/reserve/infra/compose-prod/ || echo "⚠️ No se pudo subir docker-compose.yaml (puede que ya esté actualizado)"

          # Ejecutar despliegue
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            cd ~/reserve/infra/compose-prod || exit 1

            # Verificar que existe .env
            if [ ! -f .env ]; then
              echo "❌ Error: Archivo .env no encontrado en ~/reserve/infra/compose-prod/.env"
              echo "📝 Crea el archivo .env manualmente antes de ejecutar este workflow"
              exit 1
            fi
            echo "✅ Archivo .env encontrado"

            echo "🚀 Levantando todos los servicios..."

            # Login a ECR usando el IAM Role
            echo "🔐 Login a ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} 2>&1 | \
              docker login --username AWS --password-stdin ${{ steps.get_account.outputs.ECR_REGISTRY }} || {
              echo "⚠️ Error en login a ECR, verificando IAM Role..."
              aws sts get-caller-identity || echo "❌ No se puede autenticar con AWS"
              exit 1
            }

            # Pull latest images (ignorar errores de imágenes que no existen aún)
            echo "🔄 Pulling latest images from ECR..."
            docker compose -f docker-compose.yaml pull 2>&1 | grep -v "manifest unknown" || true
            echo "✅ Pull completado (algunas imágenes pueden no existir aún, es normal)"

            # Levantar todos los servicios (solo los que tienen imágenes disponibles)
            echo "🚀 Levantando servicios..."
            # Intentar levantar todos, pero no fallar si algunos no tienen imágenes
            docker compose -f docker-compose.yaml up -d 2>&1 || {
              echo "⚠️ Algunos servicios no se pudieron levantar"
              echo "📋 Esto puede ser normal si las imágenes aún no existen"
            }

            # Esperar un momento para que los servicios inicien
            sleep 5

            # Show status (no fallar si hay errores)
            echo "📊 Estado de los servicios:"
            docker compose -f docker-compose.yaml ps || echo "⚠️ No se pudo obtener el estado completo"

            # Mostrar logs recientes (solo de servicios que están corriendo)
            echo "📋 Logs recientes de servicios activos:"
            docker compose -f docker-compose.yaml logs --tail=20 2>&1 || echo "⚠️ No se pudieron obtener logs"

            # Mostrar qué contenedores están corriendo
            echo "🐳 Contenedores activos:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || echo "⚠️ No se pudieron listar contenedores"

            # Clean up old images
            docker image prune -f || true

            echo "✅ Proceso de despliegue completado"
            echo "💡 Nota: Si faltan servicios, construye las imágenes haciendo push de código a main"
          EOF
