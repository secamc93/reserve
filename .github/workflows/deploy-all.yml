name: Deploy All Services

on:
  workflow_dispatch:  # Solo ejecución manual

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy All Services
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy all services
        run: |
          # Subir podman-compose.yaml si cambió
          scp -o StrictHostKeyChecking=no \
            infra/compose-prod/podman-compose.yaml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/reserve/infra/compose-prod/ || echo "⚠️ No se pudo subir podman-compose.yaml (puede que ya esté actualizado)"
          
          # Ejecutar despliegue
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            
            # Actualizar PATH para incluir ubicaciones comunes
            export PATH=\$PATH:\$HOME/.local/bin:/usr/local/bin:/usr/bin
            
            # Verificar que podman-compose esté disponible
            if ! command -v podman-compose &> /dev/null; then
              echo "❌ podman-compose no está disponible"
              exit 1
            fi
            
            cd ~/reserve/infra/compose-prod || exit 1
            
            # Verificar que existe .env
            if [ ! -f .env ]; then
              echo "❌ Error: Archivo .env no encontrado en ~/reserve/infra/compose-prod/.env"
              echo "📝 Crea el archivo .env manualmente antes de ejecutar este workflow"
              exit 1
            fi
            echo "✅ Archivo .env encontrado"
            
            echo "🚀 Levantando todos los servicios..."
            
            # Login a ECR usando el IAM Role
            echo "🔐 Login a ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} 2>&1 | \
              podman login --username AWS --password-stdin ${{ steps.get_account.outputs.ECR_REGISTRY }} || {
              echo "⚠️ Error en login a ECR, verificando IAM Role..."
              aws sts get-caller-identity || echo "❌ No se puede autenticar con AWS"
              exit 1
            }
            
            # Pull latest images
            echo "🔄 Pulling latest images from ECR..."
            podman-compose -f podman-compose.yaml pull || echo "⚠️ Algunas imágenes no se pudieron hacer pull (puede ser normal si aún no existen)"
            
            # Levantar todos los servicios
            echo "🚀 Levantando servicios..."
            podman-compose -f podman-compose.yaml up -d
            
            # Esperar un momento para que los servicios inicien
            sleep 5
            
            # Show status
            echo "📊 Estado de los servicios:"
            podman-compose -f podman-compose.yaml ps
            
            # Mostrar logs recientes
            echo "📋 Logs recientes:"
            podman-compose -f podman-compose.yaml logs --tail=20
            
            # Clean up old images
            podman image prune -f
            
            echo "✅ Todos los servicios levantados"
          EOF
