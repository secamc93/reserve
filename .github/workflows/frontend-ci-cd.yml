name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'front/rupu-central/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'front/rupu-central/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: public.ecr.aws/d3a6d4r1/cam/reserve
  IMAGE_NAME: frontend

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo - más rápido y barato
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9  # Compatible con lockfileVersion 9.0

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} | \
            podman login --username AWS --password-stdin public.ecr.aws

      - name: Install dependencies
        working-directory: ./front/rupu-central
        run: |
          # Verificar qué gestor de paquetes usar
          if [ -f "pnpm-lock.yaml" ]; then
            echo "📦 Usando pnpm..."
            # Intentar con frozen-lockfile primero, si falla usar sin frozen
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f "package-lock.json" ]; then
            echo "📦 Usando npm..."
            npm ci || npm install
          else
            echo "⚠️ No se encontró lockfile, instalando dependencias..."
            pnpm install || npm install
          fi

      - name: Build image
        working-directory: ./front/rupu-central
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://xn--rup-joa.com/api/v1' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://central_reserve:3050/api/v1' }}
        run: |
          podman build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL} \
            --build-arg API_BASE_URL=${API_BASE_URL} \
            -f docker/Dockerfile \
            -t ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest \
            -t ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-$(date +%Y%m%d-%H%M%S) \
            .

      - name: Push image to ECR
        run: |
          podman push ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest
          # Push también el tag con timestamp
          podman push ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-$(date +%Y%m%d-%H%M%S) || true

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # Prevenir ejecuciones concurrentes del mismo workflow
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/reserve/infra/compose-prod || exit 1

            # Login a ECR
            echo "🔐 Login a ECR..."
            aws ecr-public get-login-password --region us-east-1 | \
              podman login --username AWS --password-stdin public.ecr.aws

            # Pull latest image
            echo "🔄 Pulling latest frontend image..."
            podman pull ${{ env.ECR_REPO }}:${{ env.IMAGE_NAME }}-latest

            # Stop y remove el contenedor antiguo (evita conflictos de puerto)
            echo "⏹️ Deteniendo contenedor antiguo..."
            podman-compose -f podman-compose.yaml stop frontend || true
            podman-compose -f podman-compose.yaml rm -f frontend || true

            # Levantar el nuevo contenedor
            echo "🚀 Levantando nuevo contenedor..."
            podman-compose -f podman-compose.yaml up -d frontend

            # Esperar y verificar
            sleep 5
            echo "📊 Estado del servicio:"
            podman ps --filter "name=frontend_prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # Clean up old images
            podman image prune -f

            echo "✅ Frontend desplegado exitosamente"
          EOF
