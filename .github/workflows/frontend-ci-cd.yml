name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'front/rupu-central/**'
      - '.github/workflows/frontend-ci-cd.yml'
      - '.github/scripts/ssm-deploy.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'front/rupu-central/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::334689162817:role/github-actions-rupu
  ECR_REGISTRY: 334689162817.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: rupu-frontend
  # Deben terminar en /api/v1 (el login construye ${API_BASE_URL}/auth/login)
  NEXT_PUBLIC_API_BASE_URL: 'https://xn--rup-joa.com/api/v1'
  API_BASE_URL: 'https://xn--rup-joa.com/api/v1'

jobs:
  # Solo pruebas UNITARIAS (Vitest): las e2e de Playwright corren únicamente en local
  # (.claude/rules/testing.md). Si fallan, no se construye ni se despliega.
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: front/rupu-central
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: front/rupu-central/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: front/rupu-central/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  build-and-push:
    name: Build (ARM64) and Push to ECR
    needs: unit-tests
    runs-on: ubuntu-24.04-arm  # Runner ARM64 nativo de GitHub (gratis en repos públicos)
    # En PRs solo se construye para validar; push a ECR solo desde main o manual
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: env.PUSH == 'true'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build image
        working-directory: ./front/rupu-central
        run: |
          BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL} \
            --build-arg API_BASE_URL=${API_BASE_URL} \
            -f docker/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_TIMESTAMP \
            .
          docker image inspect ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format 'Arquitectura: {{.Os}}/{{.Architecture}}'

      - name: Push image to ECR
        if: env.PUSH == 'true'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_TIMESTAMP
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Imagen pusheada: $BUILD_TIMESTAMP (+ latest)"

  deploy:
    name: Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend on EC2 (SSM)
        run: bash .github/scripts/ssm-deploy.sh frontend
