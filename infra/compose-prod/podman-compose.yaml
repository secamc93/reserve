version: "3.8"

# Configuración de servicios para producción con Podman
# Actualizado: 2025-01-13

services:

  frontend:
    platform: linux/arm64
    image: 334689162817.dkr.ecr.us-east-1.amazonaws.com/rupu-frontend:latest
    container_name: frontend_prod
    ports:
      - "8080:3000"
    env_file:
    - .env 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    depends_on:
      - central_reserve
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  central_reserve:
    image: 334689162817.dkr.ecr.us-east-1.amazonaws.com/rupu-backend:latest
    container_name: central_reserve_prod
    ports:
      - "3050:3050"
    environment:
      DB_HOST:             "postgres"
      DB_PORT:             "5432"
      DB_NAME:             "${DB_NAME}"
      DB_USER:             "${DB_USER}"
      DB_PASS:             "${DB_PASSWORD}"
      DB_LOG_LEVEL:        "${DB_LOG_LEVEL}"
      PGSSLMODE:           "${DB_SSLMODE}"
      APP_ENV:             "${APP_ENV}"
      HTTP_PORT:           "3050"
      LOG_LEVEL:           "${LOG_LEVEL}"
      JWT_SECRET:          "${JWT_SECRET}"
      URL_BASE_SWAGGER:    "${URL_BASE_SWAGGER}"
      SMTP_HOST:           "${SMTP_HOST}"
      SMTP_PORT:           "${SMTP_PORT}"
      SMTP_USER:           "${SMTP_USER}"
      SMTP_PASS:           "${SMTP_PASS}"
      FROM_EMAIL:          "${FROM_EMAIL:-}"
      SMTP_USE_STARTTLS:   "${SMTP_USE_STARTTLS}"
      SMTP_USE_TLS:        "${SMTP_USE_TLS}"
      # S3 y media
      S3_BUCKET:           "${S3_BUCKET}"
      S3_REGION:           "${S3_REGION}"
      S3_KEY:              "${S3_KEY}"
      S3_SECRET:           "${S3_SECRET}"
      URL_BASE_DOMAIN_S3:  "${URL_BASE_DOMAIN_S3}"
    volumes:
      # Permitir acceso al socket de Podman para leer logs de contenedores
      - /run/podman/podman.sock:/run/podman/podman.sock:ro
    group_add:
      # GID del grupo podman en el host para acceder al socket
      - "988"
    restart: unless-stopped
  
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M

  postgres:
    image: postgres:15-alpine
    container_name: postgres_prod
    env_file:
      - .env
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB:       "${DB_NAME}"
      POSTGRES_USER:     "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Usando directorio accesible por Podman rootless (ruta absoluta)
      # Los datos se copian desde Docker a este directorio
      # :Z permite que Podman ajuste los permisos SELinux/AppArmor
      - /home/ubuntu/reserve/postgres-data:/var/lib/postgresql/data:Z
    # Ejecutar postgres directamente, saltando el entrypoint que intenta cambiar permisos
    # Esto funciona porque ya tenemos datos existentes y no necesitamos inicialización
    command: ["postgres", "-c", "listen_addresses=*"]
    # Ejecutar como root para evitar problemas de permisos con bind mount
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: 334689162817.dkr.ecr.us-east-1.amazonaws.com/rupu-nginx:latest
    container_name: nginx_prod
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # Ejecutar como root para poder leer certificados SSL
    user: "0:0"
    depends_on:
      - frontend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # postgres_data ya no se usa, estamos usando el volumen de Docker directamente
  # postgres_data:
  #   driver: local
